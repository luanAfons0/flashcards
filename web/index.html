<div class="page" id="page">
  <header class="bar" id="bar">
    <span class="mark">flashcards</span>
    <nav class="tabs" aria-label="flashcards">
      <a href="#decks" data-tab="decks">Decks</a>
      <a href="#notes" data-tab="notes">Notes</a>
      <a href="#settings" data-tab="settings">Settings</a>
    </nav>
    <span class="spacer"></span>
    <a class="btn primary add" href="#add" aria-label="Add Note"><svg class="i" aria-hidden="true"><use href="#i-plus"/></svg><span class="add-label">Add Note</span></a>
  </header>

  <main>
    <p class="banner" id="banner" role="alert" hidden></p>

    <!-- Decks -->
    <section id="decks-view" aria-labelledby="h-decks" hidden>
      <div class="col">
        <div class="head"><h1 id="h-decks">Decks</h1></div>
        <div class="empty" id="decks-empty" hidden>
          <h2 id="h-empty">No Decks yet</h2>
          <p>A Deck appears when you add its first Note. Other Plugins and the Mate can add Notes too, through the <code>add_note</code> tool.</p>
          <a class="btn primary" href="#add"><svg class="i" aria-hidden="true"><use href="#i-plus"/></svg>Add Note</a>
        </div>
      </div>
    </section>

    <!-- Notes -->
    <section id="notes-view" aria-labelledby="h-notes" hidden>
      <div class="col">
        <div class="head"><h1 id="h-notes">Notes</h1></div>
      </div>
    </section>

    <!-- Note editor -->
    <section id="editor-view" aria-labelledby="h-editor" hidden>
      <div class="col" style="max-width:1040px">
        <div class="head"><h1 id="h-editor">Add Note</h1></div>
      </div>
    </section>

    <!-- Settings -->
    <section id="settings-view" aria-labelledby="h-settings" hidden>
      <div class="col settings">
        <div class="head"><h1 id="h-settings">Settings</h1></div>
      </div>
    </section>
  </main>
</div>

<script src="rpc.js"></script>
<script src="app.js"></script>
</body>
</html>
